  summary: Doctoral researcher in Artificial Intelligence and Hourly Paid Lecturer in Computer Science at Nottingham Trent University, with over two years of commercial experience designing, building, and deploying production AI and embedded software across healthcare, manufacturing, and property technology. Research focuses on compact LLMs, post-training (SFT, LoRA/QLoRA, GRPO reinforcement learning) and execution-grounded inference for personalised education, alongside explainable AI (XAI) and computer vision, with a growing focus on verifiable AI for edge hardware.

