        highlights:
          - "AI-assisted breast cancer diagnosis (Python, PyTorch, FastAPI): Built the back end deploying a CNN model with a focus on architecture and explainability."
          - "AI natural stone classifier (C#, .NET, WinUI 3, C++): Developed an MVVM Windows 11 IoT kiosk application with an SVM classifier, deployed across 80 kiosks."
          - "Embedded drivers (C, C++, Python, CppUTest, STM32): Developed a reusable CRC calculation module with unit tests, a sound (beeper) driver for a medical device, and a Python CLI release automation tool."
          - "Online catalogue (ReactJS, TypeScript, SharePoint): Built an internal management tool for a multinational healthcare client."

      - company: BooleenLab
