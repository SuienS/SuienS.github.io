        summary: Promoted from Associate Engineer within six months. Led the R&D team on commercial AI products for clients in the USA, UK, and Singapore.
        highlights:
          - "HeHealth intelligent digital health platform (Python, PyTorch, Flask, AWS): Led back-end and database engineering across doctor/admin portals and mobile app; designed a semi-serverless AWS architecture and co-developed the CNN, saliency maps, and reasoning engine."
          - "Inspective property inspection platform (Python, TensorFlow, Django, AWS): Led back-end development and deployed a custom defect-detection CNN on AWS."
          - "Recommender system for fabrics and elastics (Python, PyTorch, FastAPI, AWS): Initiated and led R&D on fabric classification and recommendation for Stretchline."

